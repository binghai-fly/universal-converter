name: universal_converter_mobile
description: Local-first Universal Converter for iPhone, iPad and Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  image: ^4.5.4
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  archive: ^4.0.7
  csv: ^6.0.0
  yaml: ^3.1.3
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
